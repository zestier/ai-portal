# Default deployment: portal only, with the project tree bind-mounted.
#
# For a public deployment behind Cloudflare Tunnel, combine this with
# `compose.tunnel.yaml` via:
#
#   docker compose -f compose.yaml -f compose.tunnel.yaml up -d
#
# PROJECT_DIR must point at the host directory the agent should read and
# edit. It will be mounted into the container at /workspace and used as
# the default working directory for new conversations.
#
# NOTE: the container runs as the built-in `node` user (UID 1000). When the
# ./data bind mount doesn't exist, Docker pre-creates it root:root and the
# portal can't open the SQLite DB. Either `chown 1000:1000 data` once, or run
# the container as your UID (see docs/deployment.md → UID / permissions).

services:
  portal:
    # Default to building from the repo checkout. Once an image has been
    # pushed to a registry, replace `build:` with
    # `image: ghcr.io/<owner>/zap:<tag>`.
    build: .
    image: zap:local
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
      PROJECT_ROOT: /workspace
      # Portal-owned linked worktrees persist with the database. Keep this
      # absolute path stable across container replacements.
      WORKTREE_ROOT: /data/worktrees
      AUTH_MODE: ${AUTH_MODE:-github}
      SESSION_SECRET: ${SESSION_SECRET:?required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?required}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ALLOWED_GITHUB_LOGINS: ${ALLOWED_GITHUB_LOGINS:-}
      SHARED_SECRET: ${SHARED_SECRET:-}
      COPILOT_GITHUB_TOKEN: ${COPILOT_GITHUB_TOKEN:-}
      # Optional: connect to an externally-run `copilot --headless --port N`
      # instead of spawning the bundled CLI. See docs/deployment.md.
      COPILOT_CLI_URL: ${COPILOT_CLI_URL:-}
      # Optional: token for a token-protected remote CLI. Must match the
      # COPILOT_CONNECTION_TOKEN set on the `copilot --headless` server.
      COPILOT_CONNECTION_TOKEN: ${COPILOT_CONNECTION_TOKEN:-}
      DEFAULT_BACKEND_PROVIDER: ${DEFAULT_BACKEND_PROVIDER:-copilot}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-claude-sonnet-4.5}
      CLAUDE_AGENT_BASE_URL: ${CLAUDE_AGENT_BASE_URL:-}
      CLAUDE_AGENT_API_KEY: ${CLAUDE_AGENT_API_KEY:-}
      CLAUDE_AGENT_MAX_TURNS: ${CLAUDE_AGENT_MAX_TURNS:-50}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      # Durable memory extraction. Set MEMORY_EXTRACTOR_BACKEND to
      # `openai-compatible` (single-shot JSON) or `openai-compatible-tools`
      # (tool-calling background agent) to harvest memories with a model;
      # both require OPENAI_COMPATIBLE_BASE_URL + a model. Defaults to the
      # local heuristic extractor when unset.
      MEMORY_EXTRACTOR_BACKEND: ${MEMORY_EXTRACTOR_BACKEND:-heuristic}
      MEMORY_EXTRACTOR_MODEL: ${MEMORY_EXTRACTOR_MODEL:-}
      MEMORY_EXTRACTOR_TIMEOUT_MS: ${MEMORY_EXTRACTOR_TIMEOUT_MS:-20000}
      MEMORY_EXTRACTOR_MAX_INPUT_CHARS: ${MEMORY_EXTRACTOR_MAX_INPUT_CHARS:-12000}
      MEMORY_EXTRACTOR_MAX_TOOL_ITERATIONS: ${MEMORY_EXTRACTOR_MAX_TOOL_ITERATIONS:-6}
      MEMORY_EXTRACTOR_MAX_WALLCLOCK_MS: ${MEMORY_EXTRACTOR_MAX_WALLCLOCK_MS:-60000}
      # Experimental adversarial approval mode, Phase 0 (shadow measurement).
      # Off unless a reviewer model is set. The reviewer runs on the
      # conversation's own backend unless ADVERSARY_SHADOW_BACKEND routes it
      # elsewhere. A user/per-conversation setting overrides these defaults.
      ADVERSARY_SHADOW_MODEL: ${ADVERSARY_SHADOW_MODEL:-}
      ADVERSARY_SHADOW_BACKEND: ${ADVERSARY_SHADOW_BACKEND:-}
      ADVERSARY_SHADOW_TIMEOUT_MS: ${ADVERSARY_SHADOW_TIMEOUT_MS:-20000}
      ADVERSARY_SHADOW_MAX_ARG_CHARS: ${ADVERSARY_SHADOW_MAX_ARG_CHARS:-4000}
      ADVERSARY_SHADOW_MAX_IN_FLIGHT: ${ADVERSARY_SHADOW_MAX_IN_FLIGHT:-4}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      IDLE_TIMEOUT_MIN: ${IDLE_TIMEOUT_MIN:-15}
      MAX_CONCURRENT_SESSIONS: ${MAX_CONCURRENT_SESSIONS:-4}
      WORKTREE_CREATE_TIMEOUT_MS: ${WORKTREE_CREATE_TIMEOUT_MS:-120000}
      ORIGIN: ${ORIGIN:-}
    volumes:
      - ./data:/data
      - ${PROJECT_DIR:?required}:/workspace
    ports:
      - '${PORTAL_BIND:-127.0.0.1}:${PORTAL_PORT:-3000}:3000'
    networks:
      - appnet
    # Cap memory/CPU so a runaway redeploy or copilot subprocess can't OOM the
    # host. Defaults budget ~1.5 GB peak for MAX_CONCURRENT_SESSIONS=4 (see
    # docs/deployment.md → Resource expectations); tune via .env if needed.
    mem_limit: ${PORTAL_MEM_LIMIT:-2g}
    cpus: ${PORTAL_CPUS:-2}
    # Bound json-file log growth so a stuck/debug-logging container can't fill
    # the host disk.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

networks:
  appnet:
    driver: bridge
