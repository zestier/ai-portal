# Overlay that adds a Cloudflare Tunnel sidecar.
#
# Usage:
#   docker compose -f compose.yaml -f compose.tunnel.yaml up -d
#
# Both services share the `appnet` bridge from compose.yaml, so cloudflared
# reaches the portal at http://portal:3000 without host networking (keeps the
# container's port namespace isolated). The portal isn't published to the host;
# public reachability comes solely from the tunnel.

services:
  portal:
    # No host port publishing — the tunnel is the only ingress. Bind inside the
    # container so cloudflared can reach it over the bridge.
    ports: !reset []
    environment:
      HOST: 0.0.0.0

  cloudflared:
    # Pinned for reproducible pulls; bump deliberately.
    image: cloudflare/cloudflared:2025.2.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?required}
    networks:
      - appnet
    # Wait until the portal is healthy so the tunnel doesn't forward traffic to
    # a not-yet-bound origin (connection-refused on cold boot).
    depends_on:
      portal:
        condition: service_healthy
    mem_limit: ${CLOUDFLARED_MEM_LIMIT:-256m}
    cpus: ${CLOUDFLARED_CPUS:-1}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
