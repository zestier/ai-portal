name: ci
on:
  push:
    branches: ['**']
  pull_request:
  # Allow other workflows (notably release.yml) to invoke the full suite as a
  # gate. Releasing a tag must re-run CI against the tagged commit so a red
  # commit can't be tagged into a published image.
  workflow_call:

# Default to no permissions; each job re-grants only `contents: read`.
# This means even if a step is compromised, GITHUB_TOKEN cannot push code,
# open issues, comment on PRs, or publish packages.
permissions: {}

# Cancel superseded runs on the same ref so a fork can't tie up the queue
# by force-pushing in a tight loop.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Fan-out structure:
#
#   install -> lint
#           -> check
#           -> test
#           -> e2e
#   docker (independent, starts immediately)
#   audit  (independent, starts immediately)
#
# `install` populates a `node_modules` cache (keyed on the lockfile) plus
# the pnpm store cache that actions/setup-node manages. Downstream jobs
# restore both, so each one only pays the actual task cost (plus a few
# seconds of cache restore) instead of re-installing from scratch.
#
# The Docker job has no `needs:` so it starts at t=0 and runs in parallel
# with everything else. It rebuilds from source inside Docker (it does
# not consume the install cache) but that work is mostly base-image
# pulls + a buildx GHA cache hit on incremental changes. The job is a
# matrix that builds each platform on a native runner (no QEMU).

jobs:
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cache-key: ${{ steps.key.outputs.value }}
    steps:
      # All actions are SHA-pinned. Update via `pnpm run release:bump-actions`;
      # tag comments show the intended major version.

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # Cache key shared with every downstream job. Tied to the lockfile so
      # any dependency change invalidates it.
      - name: Compute cache key
        id: key
        run: |
          echo "value=node_modules-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"

      - name: Cache node_modules
        id: nm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: node_modules
          key: ${{ steps.key.outputs.value }}

      - name: Install
        if: steps.nm.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

  lint:
    needs: install
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Restore node_modules
        id: nm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache-key }}

      # Fallback if the cache was evicted between install and this job.
      - name: Install (fallback)
        if: steps.nm.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - run: pnpm run lint

  check:
    needs: install
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Restore node_modules
        id: nm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache-key }}

      - name: Install (fallback)
        if: steps.nm.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - run: pnpm run check

  test:
    needs: install
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Restore node_modules
        id: nm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache-key }}

      - name: Install (fallback)
        if: steps.nm.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - run: pnpm test

  e2e:
    needs: install
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Restore node_modules
        id: nm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache-key }}

      - name: Install (fallback)
        if: steps.nm.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps firefox

      - name: Playwright e2e
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          # When e2e fails before any output is written (e.g. the build
          # step inside `test:e2e` failed), neither directory exists.
          # Don't warn the run as a result.
          if-no-files-found: ignore

  # Scan dependencies for known vulnerabilities. `pnpm audit` resolves the
  # lockfile against the registry advisory DB, so it needs neither the
  # node_modules cache nor a full install -- it runs standalone and starts
  # at t=0 alongside docker.
  #
  # Non-blocking by design (`continue-on-error`): a freshly disclosed CVE in
  # a transitive dep -- often with no fix available yet -- should surface in
  # the run summary without wedging every unrelated PR. Dependabot
  # (.github/dependabot.yml) opens the actual remediation PRs; this job is
  # the visibility tripwire.
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - name: pnpm audit
        continue-on-error: true
        run: pnpm audit --audit-level=moderate

  # Exercise the same multi-arch Docker build that release.yml publishes,
  # but without pushing. This catches arch-specific Dockerfile/base-image
  # regressions in PRs instead of only at release time.
  #
  # Each platform builds on its native GitHub-hosted runner (amd64 on
  # ubuntu-latest, arm64 on ubuntu-24.04-arm) so we don't pay the QEMU
  # emulation tax for arm64. No QEMU is involved.
  #
  # Independent of the JS test matrix above: starts immediately on push.
  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build Docker image (${{ matrix.arch }}, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          # No buildx cache: this job is a smoke test (its output is never
          # consumed), runs in parallel with the JS jobs so it's not on
          # the critical path, and writing mode=max from every branch
          # push on two arches would burn cache quota and create cross-
          # ref poisoning surface for the release build.
