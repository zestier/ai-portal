name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Prevent two release runs from racing for `:latest`.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Gate: re-run the full CI suite (lint/check/test/e2e/docker/audit) against
  # the tagged commit before anything is built or pushed. release.yml fires on
  # tag push independently of ci.yml, so without this a commit with failing CI
  # could be tagged and published to GHCR. A failure here fails the whole
  # workflow and `build`/`merge` never run.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Build each architecture on its native GitHub-hosted runner (no QEMU)
  # and push it to GHCR by digest only (no tags yet). The `merge` job
  # below then stitches the per-arch images into a single multi-arch
  # manifest under the human-readable tags.
  build:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # workflow_dispatch is restricted to the default branch so that
    # manual runs from feature branches can't publish images.
    if: github.event_name == 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      packages: write
      # Required for SLSA build provenance attestations.
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      # All actions are SHA-pinned. Update via `pnpm run release:bump-actions`;
      # tag comments show the intended major version.

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (lowercase)
        id: image
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Image metadata (labels only)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.value }}

      - name: Build and push (${{ matrix.arch }}, by digest)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Push without tags; the `merge` job assembles the tagged
          # manifest list from the resulting digests.
          outputs: type=image,name=${{ steps.image.outputs.value }},push-by-digest=true,name-canonical=true,push=true
          # No buildx GHA cache: releases are infrequent and almost
          # always include source/lockfile changes that invalidate the
          # interesting layers anyway, so the hit rate is low. More
          # importantly, a writable cache is a supply-chain risk: GHA
          # cache reads fall back across refs, so a compromised run on
          # any branch could plant a layer that a tagged release later
          # restores. Provenance attestations cover the manifest, not
          # the trustworthiness of the cache that produced it.
          provenance: mode=max
          sbom: true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (lowercase)
        id: image
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.value }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Create manifest list and push
        id: push
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.image.outputs.value }}@sha256:%s ' *)

      - name: Inspect manifest digest
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect \
            '${{ steps.image.outputs.value }}:${{ steps.meta.outputs.version }}' \
            --format '{{json .Manifest}}' | jq -r .digest)
          echo "value=$digest" >> "$GITHUB_OUTPUT"

      # Cryptographically attest the published manifest so consumers can verify
      # it with `gh attestation verify`.
      - name: Attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.value }}
          subject-digest: ${{ steps.digest.outputs.value }}
          push-to-registry: true

  # Build the npm tarball and attach it to the tag's GitHub release. This is
  # a "regular" tarball: dependencies (including native modules such as
  # better-sqlite3) resolve from the registry at install time, so it is not
  # offline-installable. Consumers install it with
  # `npm i https://github.com/<owner>/zap/releases/download/<tag>/zap-<tag>.tgz`.
  pack:
    needs: ci
    runs-on: ubuntu-latest
    # Tag pushes only. workflow_dispatch runs against a branch ref, where
    # there is no release to attach to.
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Pack tarball
        run: |
          tarball=$(npm pack)
          mv "$tarball" "zap-$GITHUB_REF_NAME.tgz"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "zap-$GITHUB_REF_NAME.tgz"
